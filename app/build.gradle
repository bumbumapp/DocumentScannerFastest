plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
   
}


// Huawei Ads (Petal) slot IDs for the AppGallery build: -PHMS_BANNER_ID=... or a gitignored ads.properties.
// Until the real slots are set the hms build falls back to Huawei's public test slots.
def hmsAdsProps = new Properties()
def hmsAdsFile = rootProject.file('ads.properties')
if (hmsAdsFile.exists()) hmsAdsFile.withInputStream { hmsAdsProps.load(it) }
def hmsAdId = { String key, String fallback -> ((project.findProperty(key) ?: hmsAdsProps.getProperty(key))?.toString()?.trim()) ?: fallback }
def HMS_TEST_BANNER_ID = 'testw6vs28auh3'
def HMS_TEST_INTERSTITIAL_ID = 'testb4znbuh3n2'
def HMS_BANNER_ID = hmsAdId('HMS_BANNER_ID', HMS_TEST_BANNER_ID)
def HMS_INTERSTITIAL_ID = hmsAdId('HMS_INTERSTITIAL_ID', HMS_TEST_INTERSTITIAL_ID)
android {
    namespace 'com.bumbumapps.documentscannerfastest'
    compileSdk 36

    defaultConfig {
        applicationId "com.bumbumapps.documentscannerfastest"
        minSdk 24
        targetSdk 36
        versionCode 21
        versionName "4.5.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

    }

    buildFeatures {
        buildConfig true
        resValues true
    }
    // play = Google Play (AdMob + UMP), hms = Huawei AppGallery (Huawei Ads, no Google Mobile Services).
    flavorDimensions = ['store']
    productFlavors {
        play {
            dimension 'store'
        }
        hms {
            dimension 'store'
            resValue 'string', 'hms_banner_id', HMS_BANNER_ID
            resValue 'string', 'hms_interstitial_id', HMS_INTERSTITIAL_ID
            resValue 'string', 'hms_test_banner_id', HMS_TEST_BANNER_ID
            resValue 'string', 'hms_test_interstitial_id', HMS_TEST_INTERSTITIAL_ID
        }
    }

    buildTypes {
        debug {
            // Google's public test IDs so debug builds never request real ads.
            resValue 'string', 'app_id', 'ca-app-pub-3940256099942544~3347511713'
            resValue 'string', 'admob_banner_id', 'ca-app-pub-3940256099942544/9214589741'
            resValue 'string', 'intersitial_id', 'ca-app-pub-3940256099942544/1033173712'
        }
        release {
            // Real AdMob IDs (AdMob app "Doc scanner & PDF maker", from the AdMob API).
            resValue 'string', 'app_id', 'ca-app-pub-8444865753152507~2291016643'
            resValue 'string', 'admob_banner_id', 'ca-app-pub-8444865753152507/4923076739'
            resValue 'string', 'intersitial_id', 'ca-app-pub-8444865753152507/2006366830'
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                abiFilters "arm64-v8a", "armeabi-v7a"
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets {
        main {
            assets {
                srcDirs 'src/main/assets'
            }
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
    androidResources {
        noCompress 'tflite', 'lite'
    }

    /* Reduce apk size */
//    splits {
//        abi {
//            enable true
//            reset()
//            include "x86_64", "x86", "armeabi-v7a", "arm64-v8a"
//            universalApk true
//        }
//    }
    splits {
        abi {
            def isReleaseBuild = false

            gradle.startParameter.taskNames.find {
                // Enable split for release builds in different build flavors
                // (assemblePaidRelease, assembleFreeRelease, etc.).
                if (it ==~ /:app:assemble.*Release/) {
                    isReleaseBuild = true
                    return true // break
                }

                return false // continue
            }

            // Enables building multiple APKs per ABI. Kept off: it conflicts with the release
            // ndk.abiFilters (assemble*Release failed to configure); the release APK (AppGallery) is
            // a single arm64-v8a + armeabi-v7a APK and the Play bundle is unaffected.
            enable false
            //...
        }
    }

}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation "androidx.activity:activity:1.10.1"
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation project(path: ':scanlibrary')
    implementation project(path: ':sticker')
    implementation project(path: ':vendored')
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

    playImplementation 'com.google.android.gms:play-services-ads:25.5.0'
    playImplementation 'com.google.android.ump:user-messaging-platform:4.0.0'
    hmsImplementation 'com.huawei.hms:ads-lite:13.4.91.301'
    implementation 'androidx.core:core:1.17.0'
//    implementation group: 'com.itextpdf', name: 'itextpdf', version: '5.5.9'
    implementation fileTree(dir: 'libs', include: '*.jar')
    implementation files('libs/itextpdf-5.5.13.2.jar')

    implementation group: 'cz.msebera.android', name: 'httpclient', version: '4.4.1.1'
    implementation 'com.github.pqpo:SmartCropper:v2.1.3'
    implementation 'com.github.chrisbanes:PhotoView:2.3.0'

    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'


    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'com.github.QuadFlask:colorpicker:0.0.15'
    implementation 'com.burhanrashid52:photoeditor:1.1.1'

    implementation 'com.google.android.gms:play-services-vision:20.1.3'

    implementation group: 'org.bouncycastle', name: 'bcprov-jdk15to18', version: '1.64'
//Thanks for using https://jar-download.com
    implementation 'jp.wasabeef:richeditor-android:2.0.0'
    implementation 'com.google.zxing:core:3.3.3'
    // https://mvnrepository.com/artifact/com.github.google/cameraview
//    implementation group: 'com.github.google', name: 'cameraview', version: '6ceaf867d3'

    api 'com.otaliastudios:cameraview:2.7.1'

    implementation 'com.github.yalantis:ucrop:2.2.6'
    implementation 'com.edmodo:cropper:1.0.1'
    implementation 'com.loopj.android:android-async-http:1.4.9'
    implementation 'com.intuit.sdp:sdp-android:1.0.6'
    implementation 'com.makeramen:roundedimageview:2.3.0'

    implementation 'androidx.work:work-runtime:2.10.5'
    implementation platform('com.google.firebase:firebase-bom:35.1.0')
1
    // Add the dependencies for the Crashlytics and Analytics libraries
    // When using the BoM, you don't specify versions in Firebase library dependencies
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.firebase:firebase-analytics'

}